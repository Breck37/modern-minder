version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    groups:
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - 'jest-expo'
          - 'eslint-config-expo'
      react-native:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - 'nativewind'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - 'react-test-renderer'
          - '@types/react'
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'jest-expo'
          - 'eslint-config-expo'
          - 'react-test-renderer'
          - '@types/react'
    # React, React Native and native modules are pinned by the Expo SDK.
    # Upgrade them together with `npx expo install expo@<sdk> --fix`, not one by one.
    ignore:
      - dependency-name: 'react'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-dom'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-test-renderer'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'react-native-*'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'jest-expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-config-expo'
        update-types: ['version-update:semver-major']
      # NativeWind 4 only supports Tailwind CSS v3.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
